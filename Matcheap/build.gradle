// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.55'
        classpath 'androidx.navigation:navigation-safe-args-gradle-plugin:2.9.3'
        classpath 'com.google.gms:google-services:4.4.3'
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.1.20-2.0.1'
        classpath 'androidx.room:androidx.room.gradle.plugin:2.7.2'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}